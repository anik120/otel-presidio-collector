# Runtime config for the PoC collector.
# LCORE exports OTLP to this collector on :4317; the presidio processor redacts
# span content; spans are forwarded to Jaeger (OTLP on host :4319 — see
# docker-compose.yaml, which keeps :4317 free for this collector binary).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  presidio:
    analyzer_endpoint: http://localhost:5002
    anonymizer_endpoint: http://localhost:5001
    attributes: [request.input, response.output, rag.input]
    language: en
    replacement: "<REDACTED>"
    timeout: 5s
    # Restrict detection to real PII types. Without this, Presidio's default
    # recognizers over-fire on technical text (dates like "2014", product names
    # like "Kubernetes"/"kubelet" misread as PERSON/LOCATION).
    entities:
      - PERSON
      - EMAIL_ADDRESS
      - PHONE_NUMBER
      - CREDIT_CARD
      - US_SSN
      - IP_ADDRESS
      - IBAN_CODE
      - LOCATION
    # Drop low-confidence hits; raise toward ~0.6-0.85 to cut more false positives.
    score_threshold: 0.5
    # Terms the analyzer must never flag (domain vocabulary that NER misreads).
    allow_list:
      - Kubernetes
      - K8s
      - Docker
      - Podman
      - OpenShift
      - CNCF
      - etcd
      - kubelet
      - NFS
      - Ceph
      - Borg
  batch: {}

exporters:
  debug:
    verbosity: detailed
  otlp/jaeger:
    endpoint: localhost:4319
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, presidio, batch]
      exporters: [otlp/jaeger, debug]
  telemetry:
    logs:
      level: info
