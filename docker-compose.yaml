# Dependencies for the PoC: the data-anonymizer service and Jaeger.
# The custom collector itself runs as a host binary (make run) and owns :4317,
# so Jaeger's OTLP is published on :4319 to avoid a clash.
services:
  data-anonymizer:
    build:
      context: ./anonymizer-service   # installs data-anonymizer from GitLab (see its Dockerfile)
    container_name: data-anonymizer
    ports:
      - "5000:8000"   # FastAPI wrapper: POST /anonymize

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      - "4319:4317"   # Jaeger OTLP gRPC (host 4319; collector binary owns 4317)
